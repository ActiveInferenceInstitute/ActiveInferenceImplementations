# AII sidecar — InstituteOS metadata. Schema: aii_platform.aii_sidecar
meta:
  sidecar_version: 1.2.1
  updated: '2026-11-12'
repo:
  name: ActiveInferenceImplementations
  slug: activeinferenceimplementations
  full_name: ActiveInferenceInstitute/ActiveInferenceImplementations
  description: Educational Jupyter notebooks exploring probabilistic inference and
    active inference with RxInfer.jl, from Beta-Bernoulli coin inference to variational
    message passing.
institute:
  category: education
  status: active
  maturity: wip
  steward: Active Inference Institute
ecosystem:
  relations:
  - repo: ActiveInferenceInstitute/InstituteOS
    relation: referenced-by
    note: Federated via the InstituteOS .aii manifest.
  - repo: ActiveInferenceInstitute/Active_Inference_Ontology
    note: Uses Active Inference Ontology terms.
  - repo: ActiveInferenceInstitute/Generalized_Notation_Notation
    note: Uses Generalized Notation Notation (GNN) for model specifications.
  links:
    github: https://github.com/ActiveInferenceInstitute/ActiveInferenceImplementations
    website: https://www.activeinference.org
artifacts:
- path: README.md
  kind: doc
  description: Repository overview.
- path: LICENSE
  kind: doc
  description: License.
- path: CITATION.cff
  kind: citation
  description: Machine-readable citation metadata.
- path: Project.toml
  kind: code
  description: Julia project configuration.
- path: RxInfer.jl
  kind: notebook
  description: Educational RxInfer.jl notebooks (the repository's primary content).
- path: specs
  kind: doc
  description: GNN model specification and the pinned upstream revision.
- path: test
  kind: test
  description: Julia test suite for the declared model and the recovered posterior.
- path: src
  kind: code
  description: Source tree.
- path: AGENTS.md
  kind: doc
  description: Agent guidance.
- path: docs/README.md
  kind: doc
  description: Documentation index for the repository.
- path: docs/repository-layout.md
  kind: doc
  description: Map of the tracked tree and how the pieces fit together.
- path: docs/notebooks.md
  kind: doc
  description: Notebook teaching order, run instructions, and output behaviour.
- path: docs/gnn-conformance.md
  kind: doc
  description: The GNN pin, the three readers, digest checks, and the conformance gate.
