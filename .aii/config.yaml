  license: CC-BY-4.0
  citation:
    text: Active Inference Institute — ActiveInferenceImplementations.
instituteos:
  tags:
  - education
  - rxinfer
  - probabilistic-inference
  - jupyter
capabilities:
- notebooks
- julia-package
- tested
- ci
- citation
