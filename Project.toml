# Notebook environment for the RxInfer.jl tutorials in RxInfer.jl/.
#
#   julia --project=. -e 'using Pkg; Pkg.instantiate()'
#
# The compat bounds follow the notebook dependencies (RxInfer 6 requires Julia
# 1.10 or newer). The configuration exercised by .github/workflows/ci.yml is
# Julia 1.13 with the versions resolved from this file.

[deps]
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
RxInfer = "86711068-29c9-4ff7-b620-ae75d7495b3d"

[compat]
Distributions = "0.25"
Plots = "1"
RxInfer = "6"
julia = "1.10"
