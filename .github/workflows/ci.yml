name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every gate step calls an arm of ./run.sh, the same entry point a local run
# uses, so the commands cannot drift. One job provisions the Julia, uv, GNN, and
# notebook environments once; the arms then share them.
#
# `./run.sh test` is the full suite and includes the `test-fast` static gates,
# so the fast arm is not repeated here.
jobs:
  gate:
    name: gates (julia 1.13, python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the canonical Education checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ActiveInferenceInstitute/courses
          ref: f1e5af62dc2581b9d4c09746c8b7c4fa09dc5e1b
          path: _build/courses
          persist-credentials: false

      - name: Set up Julia 1.13
        uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"

      - name: Cache Julia artifacts and packages
        uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0

      - name: Set up uv
        # v10.3.3; setup-uv publishes no floating v10 major tag, so @v10 is unresolvable
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Provision the Julia, notebook, and IJulia environments
        run: ./run.sh setup

      - name: Lint
        run: ./run.sh lint

      - name: Test suite
        run: ./run.sh test

      - name: Documentation links and generated gate table
        run: ./run.sh docs

      - name: GNN conformance
        run: ./run.sh gnn

      - name: Education contract
        env:
          EDUCATION_ROOT: ${{ github.workspace }}/_build/courses
        run: ./run.sh contract

      - name: Execute the notebooks
        run: ./run.sh notebooks
